name: Capturar telas do ROXO (somente revisão)

on:
  push:
    branches: [fix/portfolio-visual-e-rolagem]
    paths:
      - scripts/capture-roxo.py
      - .github/workflows/capture-roxo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.repository == 'palomagl/unica'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-visual-e-rolagem
          persist-credentials: true
      - name: Preparar navegador Python
        run: |
          python3 -m pip install --user playwright pillow
      - name: Capturar a loja publicada sem modificar o projeto ROXO
        run: python3 scripts/capture-roxo.py
      - name: Validar build e arquivos
        run: |
          npm ci
          npm run perf:check
          npm run build
      - name: Gravar as telas no branch de revisão
        run: |
          if git diff --quiet -- public/screens/roxo-desktop-alpha.svg public/screens/roxo-mobile-alpha.svg; then
            echo "Telas atuais preservadas: nenhuma captura nova válida"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screens/roxo-desktop-alpha.svg public/screens/roxo-mobile-alpha.svg
          git commit -m "assets: incorporar capturas publicadas do ROXO"
          git push origin HEAD:fix/portfolio-visual-e-rolagem
